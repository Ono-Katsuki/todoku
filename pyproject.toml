[project]
name = "todoku"
version = "0.2.0"
description = "書類を、内容を一字も変えずにAIと支援技術に届ける変換・診断ツール"
readme = "README.md"
requires-python = ">=3.11"  # 字の性質は動いている Python の unicodedata から読む（chars.py）。README の「Python の版」
dependencies = []

[project.scripts]
todoku = "todoku.cli:main"
todoku-mcp = "todoku.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
