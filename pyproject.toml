[project]
name = "todoku"
version = "0.2.0"
description = "書類を、内容を一字も変えずにAIと支援技術に届ける変換・診断ツール"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "src/todoku/pdf/data/LICENSE-*.txt", "LICENSES/*.txt"]
requires-python = ">=3.11"  # 字の性質は動いている Python の unicodedata から読む（chars.py）。README の「Python の版」
dependencies = []

[project.scripts]
todoku = "todoku.cli:main"
todoku-mcp = "todoku.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todoku"]  # src/todoku/pdf/data の同梱の書体（NotoSansJP-Regular.ttf.gz）と、そのライセンスの全文も入る

[tool.pytest.ini_options]
testpaths = ["tests"]
